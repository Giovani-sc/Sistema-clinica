<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClíníVet - Novo Funcionário</title>
  <link rel="stylesheet" href="main.css">
</head>
<body class="dashboard-body">

  <!-- Sidebar Lateral -->
  <aside class="sidebar">
    <div class="logo-container">
      <img src="clinica.png" alt="ClíníVet Logo" class="sidebar-logo">
    </div>

    <nav class="sidebar-nav">
      <a href="./painel.html" class="nav-item">📊 Painel da Clínica</a>
      <a href="./clientes.html" class="nav-item">👥 Clientes</a>
      <a href="./funcionarios.html" class="nav-item active">🧑‍⚕️ Funcionários</a>
      <a href="#" class="nav-item">📅 Consultas</a>
      <a href="./exames.html" class="nav-item">
        🧪 Exames
      </a>
      <a href="./configuracoes.html" class="nav-item">⚙️ Configurações</a>
    </nav>

    <div class="sidebar-footer">
      <a href="./index.html" class="nav-item logout">🚪 Sair</a>
    </div>
  </aside>

  <!-- Conteúdo Principal -->
  <main class="main-content">
    
    <header class="dashboard-header">
      <div>
        <h1>Cadastrar Funcionário</h1>
        <p class="subtitle">Adicione um novo colaborador ou médico veterinário à equipe</p>
      </div>

      <div class="header-actions">
        <div class="user-profile">
          <div class="avatar">V</div>
          <div class="user-info">
            <span class="user-name">Veterinário</span>
            <span class="user-role">Administrador</span>
          </div>
        </div>
      </div>
    </header>

    <!-- Formulário de Cadastro -->
    <div class="panel-card">
      <form id="formNovoFuncionario" onsubmit="event.preventDefault(); alert('Funcionário cadastrado com sucesso!'); window.location.href='./funcionarios.html';">
        
        <h3 style="margin-bottom: 20px; color: #1b4332;">Dados Pessoais</h3>
        
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px; margin-bottom: 20px;">
          <div>
            <label style="display: block; font-weight: 600; margin-bottom: 6px;">Nome Completo *</label>
            <input type="text" required class="search-input" style="width: 100%;" placeholder="Ex: Dra. Juliana Paes">
          </div>

          <div>
            <label style="display: block; font-weight: 600; margin-bottom: 6px;">CPF *</label>
            <input type="text" required class="search-input" style="width: 100%;" placeholder="000.000.000-00">
          </div>

          <div>
            <label style="display: block; font-weight: 600; margin-bottom: 6px;">Telefone / WhatsApp *</label>
            <input type="text" required class="search-input" style="width: 100%;" placeholder="(61) 99999-9999">
          </div>

          <div>
            <label style="display: block; font-weight: 600; margin-bottom: 6px;">E-mail *</label>
            <input type="email" required class="search-input" style="width: 100%;" placeholder="funcionario@clinivet.com">
          </div>
        </div>

        <h3 style="margin-bottom: 20px; color: #1b4332; padding-top: 10px; border-top: 1px solid #e2e8f0;">Informações Profissionais</h3>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px; margin-bottom: 24px;">
          <div>
            <label style="display: block; font-weight: 600; margin-bottom: 6px;">Cargo / Função *</label>
            <select required class="search-input" style="width: 100%; background: #fff;">
              <option value="">Selecione um cargo...</option>
              <option value="vet">Médico(a) Veterinário(a)</option>
              <option value="cirurgiao">Cirurgião(ã) Veterinário(a)</option>
              <option value="recepcao">Recepcionista</option>
              <option value="auxiliar">Auxiliar Veterinário</option>
              <option value="adm">Administrador</option>
            </select>
          </div>

          <div>
            <label style="display: block; font-weight: 600; margin-bottom: 6px;">CRMV (Se Veterinário)</label>
            <input type="text" class="search-input" style="width: 100%;" placeholder="Ex: CRMV-DF 1234">
          </div>

          <div>
            <label style="display: block; font-weight: 600; margin-bottom: 6px;">Região de Atuação (DF)</label>
            <select class="search-input" style="width: 100%; background: #fff;">
              <option value="Plano Piloto">Plano Piloto</option>
              <option value="Águas Claras">Águas Claras</option>
              <option value="Taguatinga">Taguatinga</option>
              <option value="Sudoeste">Sudoeste</option>
              <option value="Gama">Gama</option>
              <option value="Outra">Outra Região</option>
            </select>
          </div>

          <div>
            <label style="display: block; font-weight: 600; margin-bottom: 6px;">Status</label>
            <select class="search-input" style="width: 100%; background: #fff;">
              <option value="ativo">Ativo</option>
              <option value="inativo">Inativo</option>
            </select>
          </div>
        </div>

        <!-- Botões de Ação -->
        <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 20px;">
          <a href="./funcionarios.html" style="padding: 10px 20px; border: 1px solid #cbd5e1; border-radius: 8px; text-decoration: none; color: #475569; font-weight: 600;">Cancelar</a>
          <button type="submit" class="btn-novo-cliente" style="border: none; cursor: pointer;">Salvar Funcionário</button>
        </div>

      </form>
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
