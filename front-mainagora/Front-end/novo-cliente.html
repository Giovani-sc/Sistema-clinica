<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClíníVet - Cadastrar Cliente</title>
  <link rel="stylesheet" href="./main.css">
</head>
<body class="dashboard-body">

  <!-- Sidebar Lateral -->
  <aside class="sidebar">
    <div class="logo-container">
      <img src="clinica.png" alt="ClíníVet Logo" class="sidebar-logo">
    </div>

    <nav class="sidebar-nav">
      <a href="./painel.html" class="nav-item">📊 Painel da Clínica</a>
      <a href="./clientes.html" class="nav-item active">👥 Clientes</a>
      <a href="./funcionarios.html" class="nav-item">🧑‍⚕️ Funcionários</a>
      <a href="#" class="nav-item">📅 Consultas</a>
      <a href="./exames.html" class="nav-item">
        🧪 Exames
      </a>
      <a href="./configuracoes.html" class="nav-item">⚙️ Configurações</a>
    </nav>

    <div class="sidebar-footer">
      <a href="./index.html" class="nav-item logout">🚪 Sair</a>
    </div>
  </aside>

  <!-- Conteúdo Principal -->
  <main class="main-content">
    
    <header class="dashboard-header">
      <div>
        <h1>Cadastrar Novo Cliente</h1>
        <p class="subtitle">Insira os dados do tutor e do animal de estimação</p>
      </div>

      <div class="header-actions">
        <div class="user-profile">
          <div class="avatar">V</div>
          <div class="user-info">
            <span class="user-name">Veterinário</span>
            <span class="user-role">Administrador</span>
          </div>
        </div>
      </div>
    </header>

    <!-- Formulário de Cadastro -->
    <div class="panel-card">
      <form id="formNovoCliente" onsubmit="event.preventDefault(); alert('Cliente cadastrado com sucesso!'); window.location.href='./clientes.html';">
        
        <h3 style="margin-bottom: 20px; color: #1b4332;">Dados do Tutor</h3>
        
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px; margin-bottom: 20px;">
          <div>
            <label style="display: block; font-weight: 600; margin-bottom: 6px;">Nome Completo *</label>
            <input type="text" required class="search-input" style="width: 100%;" placeholder="Ex: João da Silva">
          </div>

          <div>
            <label style="display: block; font-weight: 600; margin-bottom: 6px;">CPF *</label>
            <input type="text" required class="search-input" style="width: 100%;" placeholder="000.000.000-00">
          </div>

          <div>
            <label style="display: block; font-weight: 600; margin-bottom: 6px;">Telefone / WhatsApp *</label>
            <input type="text" required class="search-input" style="width: 100%;" placeholder="(61) 99999-9999">
          </div>

          <div>
            <label style="display: block; font-weight: 600; margin-bottom: 6px;">E-mail</label>
            <input type="email" class="search-input" style="width: 100%;" placeholder="cliente@email.com">
          </div>
        </div>

        <h3 style="margin-bottom: 20px; color: #1b4332; padding-top: 10px; border-top: 1px solid #e2e8f0;">Endereço (Distrito Federal)</h3>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px; margin-bottom: 24px;">
          <div>
            <label style="display: block; font-weight: 600; margin-bottom: 6px;">UF</label>
            <input type="text" value="DF" readonly class="search-input" style="width: 100%; background-color: #f3f4f6; cursor: not-allowed;">
          </div>

          <div>
            <label style="display: block; font-weight: 600; margin-bottom: 6px;">Região Administrativa / Cidade *</label>
            <select required class="search-input" style="width: 100%; background: #fff;">
              <option value="">Selecione a região...</option>
              <option value="Plano Piloto (Asa Sul/Norte)">Plano Piloto (Asa Sul/Norte)</option>
              <option value="Águas Claras">Águas Claras</option>
              <option value="Sudoeste / Octogonal">Sudoeste / Octogonal</option>
              <option value="Lago Sul">Lago Sul</option>
              <option value="Lago Norte">Lago Norte</option>
              <option value="Taguatinga">Taguatinga</option>
              <option value="Ceilândia">Ceilândia</option>
              <option value="Guará">Guará</option>
              <option value="Gama">Gama</option>
              <option value="Sobradinho">Sobradinho</option>
              <option value="Samambaia">Samambaia</option>
              <option value="Vicente Pires">Vicente Pires</option>
              <option value="Park Way">Park Way</option>
              <option value="Noroeste">Noroeste</option>
              <option value="Jardim Botânico">Jardim Botânico</option>
              <option value="Outra Região do DF">Outra Região do DF</option>
            </select>
          </div>

          <div style="grid-column: span 2;">
            <label style="display: block; font-weight: 600; margin-bottom: 6px;">Endereço Completo (Quadra, Bloco, Casa)</label>
            <input type="text" class="search-input" style="width: 100%;" placeholder="Ex: SQN 205 Bloco C Apt 101">
          </div>
        </div>

        <h3 style="margin-bottom: 20px; color: #1b4332; padding-top: 10px; border-top: 1px solid #e2e8f0;">Dados do Pet Principal</h3>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px;">
          <div>
            <label style="display: block; font-weight: 600; margin-bottom: 6px;">Nome do Pet *</label>
            <input type="text" required class="search-input" style="width: 100%;" placeholder="Ex: Rex">
          </div>

          <div>
            <label style="display: block; font-weight: 600; margin-bottom: 6px;">Espécie *</label>
            <select required class="search-input" style="width: 100%; background: #fff;">
              <option value="Cão">Cão</option>
              <option value="Gato">Gato</option>
              <option value="Ave">Ave</option>
              <option value="Outro">Outro</option>
            </select>
          </div>

          <div>
            <label style="display: block; font-weight: 600; margin-bottom: 6px;">Raça</label>
            <input type="text" class="search-input" style="width: 100%;" placeholder="Ex: SRD, Poodle...">
          </div>
        </div>

        <!-- Botões de Ação -->
        <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 20px;">
          <a href="./clientes.html" style="padding: 10px 20px; border: 1px solid #cbd5e1; border-radius: 8px; text-decoration: none; color: #475569; font-weight: 600;">Cancelar</a>
          <button type="submit" class="btn-novo-cliente" style="border: none; cursor: pointer;">Salvar Cliente</button>
        </div>

      </form>
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
