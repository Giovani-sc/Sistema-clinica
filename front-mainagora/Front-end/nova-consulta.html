<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClíníVet - Registrar Consulta</title>
  <link rel="stylesheet" href="./main.css">
</head>
<body class="dashboard-body">

  <aside class="sidebar">
    <div class="logo-container">
      <img src="clinica.png" alt="ClíníVet Logo" class="sidebar-logo">
    </div>

    <nav class="sidebar-nav">
      <a href="./painel.html" class="nav-item">📊 Painel da Clínica</a>
      <a href="./clientes.html" class="nav-item">👥 Clientes</a>
      <a href="./funcionarios.html" class="nav-item">🧑‍⚕️ Funcionários</a>
      <a href="./consultas.html" class="nav-item active">📅 Consultas</a>
      <a href="./exames.html" class="nav-item">
        🧪 Exames
      </a>
      <a href="./configuracoes.html" class="nav-item">⚙️ Configurações</a>
    </nav>

    <div class="sidebar-footer">
      <a href="./index.html" class="nav-item logout">🚪 Sair</a>
    </div>
  </aside>

  <main class="main-content">
    
    <header class="dashboard-header">
      <div>
        <h1>Registrar / Agendar Consulta</h1>
        <p class="subtitle">Preencha as informações do atendimento clínico</p>
      </div>

      <div class="header-actions">
        <div class="user-profile">
          <div class="avatar">V</div>
          <div class="user-info">
            <span class="user-name">Veterinário</span>
            <span class="user-role">Administrador</span>
          </div>
        </div>
      </div>
    </header>

    <div class="panel-card">
      <form id="formNovaConsulta" onsubmit="event.preventDefault(); alert('Consulta registrada com sucesso!'); window.location.href='./consultas.html';">
        
        <h3 style="margin-bottom: 20px; color: #1b4332;">Informações Básicas</h3>
        
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 20px;">

          <div>
            <label for="id-consulta" style="display: block; font-weight: 600; margin-bottom: 6px;">Consulta *</label>
            <input type="number" id="id-consulta" name="id_consulta" required class="search-input" style="width: 100%;" placeholder="Ex: 101">
          </div>

          <div>
            <label for="id-veterinario" style="display: block; font-weight: 600; margin-bottom: 6px;">ID Veterinário *</label>
            <input type="number" id="id-veterinario" name="id_veterinario" required class="search-input" style="width: 100%;" placeholder="Ex: 5">
          </div>

          <div>
            <label for="data-hora" style="display: block; font-weight: 600; margin-bottom: 6px;">Data e hora *</label>
            <input type="datetime-local" id="data-hora" name="data_hora" required class="search-input" style="width: 100%;">
          </div>

          <div>
            <label for="paciente" style="display: block; font-weight: 600; margin-bottom: 6px;">Paciente (Pet) *</label>
            <select id="paciente" name="id_animal" required class="search-input" style="width: 100%; background: #fff;">
              <option value="">Selecione o animal (id_animal)...</option>
              <option value="1">Thor - Tutor: Ana Silva Sauro</option>
              <option value="2">Nina - Tutor: Carlos Eduardo</option>
              <option value="3">Bob - Tutor: Carlos Eduardo</option>
              <option value="4">Mel - Tutor: Mariana Costa</option>
            </select>
          </div>

          <div>
            <label for="tipo-consulta" style="display: block; font-weight: 600; margin-bottom: 6px;">Tipo de Consulta *</label>
            <input type="text" id="tipo-consulta" name="tipo_consulta" required class="search-input" style="width: 100%;" placeholder="Ex: Rotina, Emergência, Retorno">
          </div>

          <div>
            <label for="status" style="display: block; font-weight: 600; margin-bottom: 6px;">Status *</label>
            <select id="status" name="status" required class="search-input" style="width: 100%; background: #fff;">
              <option value="Agendada">Agendada</option>
              <option value="Em Andamento">Em Andamento</option>
              <option value="Finalizada">Finalizada</option>
              <option value="Cancelada">Cancelada</option>
            </select>
          </div>

          <div>
            <label for="valor-consulta" style="display: block; font-weight: 600; margin-bottom: 6px;">Valor da Consulta (R$)</label>
            <input type="number" id="valor-consulta" name="valor_consulta" step="0.01" min="0" class="search-input" style="width: 100%;" placeholder="0.00">
          </div>

          <div>
            <label for="gasto-insumos" style="display: block; font-weight: 600; margin-bottom: 6px;">Gasto Extra / Insumos (R$)</label>
            <input type="number" id="gasto-insumos" name="gasto_insumos" step="0.01" min="0" class="search-input" style="width: 100%;" placeholder="0.00">
          </div>

        </div>

        <div>
          <label style="display: block; font-weight: 600; margin-bottom: 6px;">Motivo da Consulta *</label>
          <input type="text" required class="search-input" style="width: 100%; margin-bottom: 20px;" placeholder="Ex: Animal apresentando vômito e febre há 2 dias">
        </div>

        <h3 style="margin-bottom: 20px; color: #1b4332; padding-top: 10px; border-top: 1px solid #e2e8f0;">Ficha Clínica</h3>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; margin-bottom: 24px;">
          <div>
            <label style="display: block; font-weight: 600; margin-bottom: 6px;">Anamnese</label>
            <textarea class="search-input" style="width: 100%; height: 90px; resize: vertical;" placeholder="Histórico relatado pelo tutor..."></textarea>
          </div>

          <div>
            <label style="display: block; font-weight: 600; margin-bottom: 6px;">Diagnóstico</label>
            <textarea class="search-input" style="width: 100%; height: 90px; resize: vertical;" placeholder="Avaliação clínica e diagnóstico provável..."></textarea>
          </div>

          <div>
            <label style="display: block; font-weight: 600; margin-bottom: 6px;">Tratamento Prescrito</label>
            <textarea class="search-input" style="width: 100%; height: 90px; resize: vertical;" placeholder="Medicamentos, dosagens e orientações..."></textarea>
          </div>

          <div>
            <label style="display: block; font-weight: 600; margin-bottom: 6px;">Observações Gerais</label>
            <textarea class="search-input" style="width: 100%; height: 90px; resize: vertical;" placeholder="Notas adicionais ou exames solicitados..."></textarea>
          </div>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 20px;">
          <a href="./consultas.html" style="padding: 10px 20px; border: 1px solid #cbd5e1; border-radius: 8px; text-decoration: none; color: #475569; font-weight: 600;">Cancelar</a>
          <button type="submit" class="btn-novo-cliente" style="border: none; cursor: pointer;">Salvar Consulta</button>
        </div>

      </form>
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
